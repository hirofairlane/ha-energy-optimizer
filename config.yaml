name: "Energy Optimizer"
description: "Smart energy management: solar battery, heat pump, pool pump, pool cleaner and dishwasher with ML + adaptive tariff rules."
version: "5.0.17"
slug: "energy_optimizer"
init: false
arch:
  - aarch64
  - amd64
  - armv7

homeassistant_api: true
auth_api: true
ingress: true
ingress_port: 8765
panel_icon: "mdi:solar-power-variant"
panel_title: "Energy Optimizer"

map:
  - type: homeassistant_config
    read_only: true

options:
  # ── General ────────────────────────────────────────────────────────────────────────────────────────
  decision_interval_minutes: 15
  retrain_cron: "0 3 * * *"
  log_level: "info"

  # ── v5 decision engine (forecasting + planner + policy) ────────────────────────────────────────────
  # When false (default), the addon runs the legacy v4 reactive engine. Flip
  # to true ONLY after the v5 forecasters have been trained on your data
  # (see docs for the wiring checklist). The legacy engine stays available
  # as the fallback for the v5 cycle whenever sensors / forecasts are missing.
  v5_engine_enabled: false

  # ── Seasons ────────────────────────────────────────────────────────────────────────────────────────
  summer_start_month: 6
  summer_end_month: 9

  # ── Battery thresholds ─────────────────────────────────────────────────────────────────────────────
  solar_tomorrow_irrisoria_kwh: 2.0
  battery_emergency_threshold: 10
  battery_low_threshold: 30
  battery_medium_threshold: 50
  battery_storm_threshold: 80
  battery_capacity_kwh: 10.0

  # ── Electrical sensors ─────────────────────────────────────────────────────────────────────────────
  sensor_battery_soc: "sensor.battery_state_of_capacity"
  sensor_battery_power: "sensor.battery_charge_discharge_power"
  sensor_grid_power: ""
  sensor_solar_power: ""

  # ── Solar forecast sensors ─────────────────────────────────────────────────────────────────────────
  sensor_solar_current_hour: "sensor.energy_current_hour"
  sensor_solar_next_hour: "sensor.energy_next_hour"
  sensor_solar_today: "sensor.energy_production_today"
  sensor_solar_tomorrow: "sensor.energy_production_tomorrow"

  # ── Temperature sensors ────────────────────────────────────────────────────────────────────────────
  sensor_temp_outdoor: ""
  sensor_temp_salon: ""

  # ── Pool pump ─────────────────────────────────────────────────────────────────────────────────────
  sensor_pool_hours_day: ""
  sensor_pool_hours_week: ""
  switch_pool: ""

  # ── Pool cleaner (limpiafondos, ~1.5 kWh) — auto-runs first 15 min with pump
  switch_pool_cleaner: ""

  # ── Heat pump actuators ────────────────────────────────────────────────────────────────────────────
  number_hvac_cool: ""
  number_hvac_heat: ""

  # ── Battery direct control (Huawei Luna2000) ──────────────────────────────────────────────────────
  number_battery_charge_cutoff: "number.battery_grid_charge_cutoff_soc"
  number_battery_charge_power: ""
  number_battery_backup_soc: ""
  switch_battery_force_charge: ""
  select_battery_mode: "select.battery_working_mode"

  # ── Dishwasher (monitored, included in consumption predictions) ────────────────────────────────────
  sensor_dishwasher_state: ""
  switch_dishwasher: ""

  # ── Weather (AEMET OpenData) for storm protection ─────────────────────────────────────────────────
  sensor_weather: "weather.aemet"

  # ── InfluxDB (optional — enables years of history for ML training) ────────────────────────────────
  influxdb_url: "http://172.30.32.1:8086"
  influxdb_db: "homeassistant"
  influxdb_user: ""
  influxdb_password: ""

  # ── Daily summary notifications ───────────────────────────────────────────────────────────────────
  notify_daily_time: "23:00"
  notify_email_service: ""
  notify_email_target: ""
  notify_telegram_service: ""

  # ── Notification toggles (can also be set from the GUI Setup panel) ───────────────────────────────
  notify_email_enabled: true
  notify_telegram_daily_enabled: true
  notify_telegram_alerts_enabled: true

  # ── Summer free-cooling (v5.0.8) ──────────────────────────────────────────────────────────────────
  # Skip heat-pump cooling when the outdoor air is already cool enough that
  # opening windows beats spending energy. All gates are no-ops if
  # `sensor_temp_outdoor` isn't wired (temp_outdoor unknown → behave like v5.0.7).
  cooling_outdoor_max_c: 22.0
  free_cooling_delta_c: 2.0
  notify_open_windows_enabled: true
  notify_open_windows_cooldown_h: 4.0

  # ── Pool manual-override (v5.0.9) ─────────────────────────────────────────────────────────────────
  # When the user flips the pool switch ON by hand, keep it on for at least
  # this many minutes before letting the automatic logic switch it off again.
  pool_manual_min_runtime_min: 50.0

  # ── HVAC off-reset (v5.0.11) ──────────────────────────────────────────────────────────────────────
  # When the addon stops asking for cooling, write this value to the cooling
  # setpoint so the slider doesn't stay at the aggressive value (16 °C) for
  # hours after surplus ends. 25 °C matches Sergio's Z1CoolingTemp baseline.
  cooling_off_setpoint_c: 25.0

  # ── Quiet log mode (v5.0.12) ──────────────────────────────────────────────────────────────────────
  # When true, suppress the routine per-category INFO lines inside each cycle
  # and replace them with: (a) `[Δ <cat>]` only when a verdict changed vs the
  # previous cycle, (b) `[HB]` once an hour as a heartbeat. WARNING/ERROR
  # always pass through. Activity tab JSON is NOT filtered — only the log.
  log_quiet_mode: false

  # ── Forecast-nocturno cooling gate (v5.0.13) ──────────────────────────────────────────────────────
  # If AEMET's forecasted overnight minimum is at or below this value,
  # skip surplus-driven cooling — the house will free-cool overnight via
  # open windows + radiant-floor inertia. Requires `aemet_night_low` role
  # in the wizard pointing at e.g. `sensor.aemet_daily_forecast_temperature_low`.
  # No-op if the role isn't mapped (sensor reads as None/0).
  cooling_skip_if_night_low_c: 18.0

  # Sensor: AEMET daily forecast — overnight minimum temperature
  sensor_aemet_night_low: ""

schema:
  decision_interval_minutes: int(5,60)
  retrain_cron: str
  log_level: "list(debug|info|warning|error)"
  v5_engine_enabled: bool
  summer_start_month: int(1,12)
  summer_end_month: int(1,12)
  solar_tomorrow_irrisoria_kwh: float
  battery_emergency_threshold: int(1,30)
  battery_low_threshold: int(10,50)
  battery_medium_threshold: int(30,80)
  battery_storm_threshold: int(50,100)
  battery_capacity_kwh: float
  sensor_battery_soc: str
  sensor_battery_power: str
  sensor_grid_power: str
  sensor_solar_power: str
  sensor_solar_current_hour: str
  sensor_solar_next_hour: str
  sensor_solar_today: str
  sensor_solar_tomorrow: str
  sensor_temp_outdoor: str
  sensor_temp_salon: str
  sensor_pool_hours_day: str
  sensor_pool_hours_week: str
  switch_pool: str
  switch_pool_cleaner: str
  number_hvac_cool: str
  number_hvac_heat: str
  number_battery_charge_cutoff: str
  number_battery_charge_power: str
  number_battery_backup_soc: str
  switch_battery_force_charge: str
  select_battery_mode: str
  sensor_dishwasher_state: str
  switch_dishwasher: str
  sensor_weather: str
  influxdb_url: str
  influxdb_db: str
  influxdb_user: str
  influxdb_password: str
  notify_daily_time: str
  notify_email_service: str
  notify_email_target: str
  notify_telegram_service: str
  notify_email_enabled: bool
  notify_telegram_daily_enabled: bool
  notify_telegram_alerts_enabled: bool
  cooling_outdoor_max_c: float
  free_cooling_delta_c: float
  notify_open_windows_enabled: bool
  notify_open_windows_cooldown_h: float
  pool_manual_min_runtime_min: float
  cooling_off_setpoint_c: float
  log_quiet_mode: bool
  cooling_skip_if_night_low_c: float
  sensor_aemet_night_low: str
